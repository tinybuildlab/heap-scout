name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test JVM modules
        run: ./gradlew --no-daemon --stacktrace test

      - name: Build executable JAR
        run: ./gradlew --no-daemon --stacktrace :app:bootJar

      - name: Upload JVM test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-reports
          path: |
            app/build/reports/tests/test
            app/build/test-results/test
            engine/build/reports/tests/test
            engine/build/test-results/test
          if-no-files-found: warn
          retention-days: 7

      - name: Upload executable JAR
        uses: actions/upload-artifact@v7
        with:
          name: heapscout-jar
          path: app/build/libs/heapscout.jar
          if-no-files-found: error
