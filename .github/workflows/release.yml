name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          npm test
          npm run build

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build executable JAR
        shell: bash
        run: >-
          ./gradlew
          -Dheapscout.runHprofIntegration=true
          -Dheapscout.runLargeHprofIntegration=true
          -PreleaseVersion="${GITHUB_REF_NAME#v}"
          test :app:bootJar

      - name: Create self-contained application image
        shell: bash
        run: |
          mkdir -p package-input release
          cp app/build/libs/heapscout.jar package-input/heapscout.jar
          cp LICENSE THIRD_PARTY_NOTICES.md package-input/
          java_options=(--java-options "-Xmx2g")
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            java_options+=(
              --java-options "-Djava.awt.headless=false"
              --java-options "-Dapple.awt.application.name=HeapScout"
            )
          fi
          jpackage \
            --type app-image \
            --name HeapScout \
            --input package-input \
            --main-jar heapscout.jar \
            --main-class org.springframework.boot.loader.launch.JarLauncher \
            "${java_options[@]}" \
            --dest release

      - name: Smoke-test Linux application image
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/smoke-package.sh release/HeapScout/bin/HeapScout release/HeapScout/lib/app

      - name: Smoke-test macOS application image
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/smoke-package.sh release/HeapScout.app/Contents/MacOS/HeapScout release/HeapScout.app/Contents/app

      - name: Smoke-test Windows application image
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/smoke-package.ps1
          -Launcher release/HeapScout/HeapScout.exe
          -LegalDirectory release/HeapScout/app

      - name: Archive Linux application image
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -czf "HeapScout-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz" -C release HeapScout
          sha256sum "HeapScout-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz" > "HeapScout-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz.sha256"

      - name: Archive macOS application image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tar -czf "HeapScout-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz" -C release HeapScout.app
          shasum -a 256 "HeapScout-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz" > "HeapScout-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz.sha256"

      - name: Archive Windows application image
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "HeapScout-$env:RUNNER_OS-$env:RUNNER_ARCH.zip"
          Compress-Archive -Path release/HeapScout -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ascii "$archive.sha256"

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: heapscout-${{ runner.os }}-${{ runner.arch }}
          path: HeapScout-*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify downloaded package checksums
        shell: bash
        run: |
          checksum_count=0
          while IFS= read -r -d '' checksum; do
            checksum_directory="$(dirname "$checksum")"
            checksum_file="$(basename "$checksum")"
            (cd "$checksum_directory" && sha256sum --check "$checksum_file")
            checksum_count=$((checksum_count + 1))
          done < <(find artifacts -type f -name '*.sha256' -print0)
          if [[ "$checksum_count" -ne 3 ]]; then
            echo "Expected 3 package checksums, found $checksum_count" >&2
            exit 1
          fi

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
